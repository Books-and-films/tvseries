<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Сериалы, которые запомнились</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, warm, personal — a list to show a friend over coffee
   IDEA a home shelf of box sets: every series is a spine, then its card
   PICTURE the shelf band: spines coloured by genre, width by number of seasons
   COLOUR white / warm night ground, dark wood shelf, genre colours: red, blue, saffron, violet, pink, teal
   TYPE Unbounded (display) + Onest (text), both with Cyrillic
   LAYOUT title, shelf full-width, filters, cards grid; phone: shelf scrolls sideways, cards one column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#15120f);--ink:light-dark(#1b1712,#f3eee6);--mute:light-dark(#6b6358,#a89f92);--line:light-dark(#e6e0d6,#2d2822);--card:light-dark(#faf8f4,#1d1915);--wood:light-dark(#2a211a,#0c0a08);--chip:light-dark(#f1ece4,#29241e);--warn:light-dark(#fff1d6,#3a2c12);--warnink:light-dark(#7a4b00,#f3c76b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{padding:clamp(28px,4vw,52px) 0 18px}
h1{font:700 clamp(30px,5vw,48px)/1.05 Unbounded,sans-serif;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:10px 0 0;max-width:60ch}
.shelf{background:var(--wood);padding:28px 0 0;margin-top:8px}
.rack{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:0 max(4vw,16px) 0;scrollbar-width:thin;max-width:1240px;margin:0 auto}
.spine{flex:none;border:0;cursor:pointer;color:#fff;border-radius:3px 3px 0 0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0;transition:transform .2s,opacity .2s;box-shadow:inset -5px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.22)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 13px/1 Onest,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine::after{content:"";position:absolute;left:0;right:0;top:12px;height:3px;background:rgba(255,255,255,.35)}
.spine:hover,.spine:focus-visible{transform:translateY(-8px)}
.spine:focus-visible{outline:3px solid #fff;outline-offset:2px}
.spine.off{opacity:.22}
.board{height:16px;background:linear-gradient(#6b4a2e,#4a3220);box-shadow:0 6px 0 #2e1f14}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:18px 0 0;color:var(--mute);font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.controls{display:grid;gap:12px;padding:22px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row b{font-weight:600;font-size:14px;color:var(--mute);width:5.5em;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 15px/1 Onest,sans-serif;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button:hover{border-color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:focus-visible,#q:focus-visible{outline:3px solid #2b59c3;outline-offset:2px}
.seg button i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
#q{font:16px Onest,sans-serif;height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:min(100%,340px)}
.found{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0 6px;color:var(--mute);font-size:14px}
.found button{font:inherit;color:var(--ink);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px 0}
h2{font:700 22px/1.1 Unbounded,sans-serif;letter-spacing:-.01em;margin:26px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--c)}
.top{display:flex;gap:12px;align-items:flex-start}
.card h3{font:700 18px/1.2 Unbounded,sans-serif;margin:0;letter-spacing:-.01em}
.orig{color:var(--mute);font-size:15px;margin-top:3px}
.who{margin-left:auto;display:flex;gap:4px;flex:none}
.who svg{width:22px;height:22px}
.ic{display:inline-flex;margin-right:6px;vertical-align:-4px}.ic svg{width:18px;height:18px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px}
.meta .y{white-space:nowrap;font-weight:600}
.st{font-size:13px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.st.done{background:var(--chip);color:var(--mute)}
.st.on{background:color-mix(in srgb,#0e9384 18%,transparent);color:light-dark(#0b6b60,#5fd3c4)}
.desc{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;background:var(--chip);padding:3px 9px;border-radius:10px}
.card{overflow:hidden}
.art{margin:-18px -18px 4px;height:150px;position:relative;background:var(--c)}
.art.photo{height:auto;aspect-ratio:16/10;background:#111;overflow:hidden}
.art.contain img{object-fit:contain}
.blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.note{margin:0;padding:10px 12px;border-left:3px solid var(--c);background:var(--bg);border-radius:0 8px 8px 0}
.note b{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.note p{margin:0 0 6px}.note p:last-child{margin:0}
.lnk{font-size:14px;color:var(--mute);margin-top:auto}
.lnk a{color:inherit}
.warn{margin:0;padding:8px 12px;background:var(--warn);color:var(--warnink);border-radius:8px;font-size:15px;font-weight:500}
.empty{padding:40px 0;color:var(--mute)}
footer{color:var(--mute);font-size:14px;padding:40px 0 48px}
@media(max-width:600px){.row b{width:100%}.spine span{font-size:12px}}
@media(prefers-reduced-motion:reduce){.spine,.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Сериалы, которые запомнились</h1>
<p class="sub">Наша домашняя полка: что смотрели, что понравилось и что советуем. Нажмите на корешок, чтобы перейти к сериалу.</p>
</header>
</div>
<section class="shelf" aria-label="Полка сериалов">
<div class="rack" id="rack"></div>
<div class="board"></div>
</section>
<div class="wrap">
<div class="legend" id="legend"></div>
<div class="controls">
<div class="row"><b>Откуда</b><div class="seg" id="f-origin"></div></div>
<div class="row"><b>Жанр</b><div class="seg" id="f-genre"></div></div>
<div class="row"><b>Статус</b><div class="seg" id="f-status"></div></div>
<div class="row"><b>Для кого</b><div class="seg" id="f-aud"></div></div>
<div class="row"><b>Длина</b><div class="seg" id="f-len"></div></div>
<div class="row"><b>Поиск</b><input id="q" type="search" placeholder="Название, актёр…" autocomplete="off"></div>
</div>
<div class="found"><span id="count"></span><button id="reset" type="button">Сбросить фильтры</button></div>
<main id="list"></main>
<footer>Годы и сезоны сверены в ноябре 2026 года. Для сериалов, которые ещё идут, указаны вышедшие сезоны.</footer>
</div>
<script>
{
/* ===== Данные. Чтобы добавить комментарий: note:"…", пометку: warn:"…", кто советует: who:["m"] / ["f"] / ["m","f"] ===== */
const G={thr:["Триллер","#d7263d"],crime:["Криминал","#a23b16"],scifi:["Фантастика","#2b59c3"],myst:["Мистика и хоррор","#5b2a86"],drama:["Драма","#d48a00"],com:["Комедия","#e04f8a"],law:["Юридический","#0e7c86"],west:["Вестерн","#8a5a2b"]};
const S=[
{id:"bar",ru:"Бар «Один звонок»",origin:"ru",y1:2025,y2:null,seasons:1,status:"on",g:["myst","thr"],extra:"7 серий, продлён на 2-й сезон",desc:"Бар появляется то в одном месте, то в другом. Там можно минуту поговорить с умершим, но плата за звонок — раунд русской рулетки. Следователь ищет пропавшего сына, и все улики ведут в этот бар. Данила Козловский в роли бармена.",note:"Первый сериал Козловского после долгого перерыва.\nПродуманный, чуть мистический сериал про человеческие трагедии: серии слабо связаны друг с другом, не считая общей канвы, в каждой серии своя история. Шикарный подбор актёров — Козловский, Витроган и другие. Козловскому есть что сыграть, и он играет.",warn:"",img:"img/bar.jpg",who:["m","f"],imdb:"Bar Odin zvonok"},
{id:"vamp",ru:"Вампиры средней полосы",origin:"ru",y1:2021,y2:2025,seasons:3,status:"done",g:["com","myst"],extra:"3-й сезон финальный",desc:"Вампиры тихо живут в Смоленске по строгим правилам, пока кто-то их не нарушает. Иронично, по-домашнему, с Юрием Стояновым в роли деда Славы.",note:"Славянское фэнтези с юмором, самоиронией и органично играющим главную роль Стояновым. Первый сезон самый сильный. В третьем история очевидным образом заканчивается, исключая возможность «сделать ещё несколько сезонов в том же духе».",warn:"Сильнее всего первый сезон",img:"img/vamp.jpg",fit:"contain",who:["m","f"],imdb:"Vampires of Midland"},
{id:"radar",ru:"Радар",origin:"ru",y1:2026,y2:null,seasons:1,status:null,g:["scifi"],extra:"9 серий",desc:"1988 год, городок у радара ПРО. Шестиклассники идут искать упавший метеорит и сталкиваются с вторжением пришельцев. По повести Александра Мирера «Главный полдень»; атмосфера позднего СССР.",note:"Что-то вроде «страшилки», которую рассказали бы в пионерском лагере (по мотивам фильма «Посредник», скверно снятого в 90-е; я зачем-то тогда его посмотрел). Но «Радар» получился действительно неплох.",warn:"",img:"img/radar.jpg",fit:"contain",who:["m","f"],imdb:"Radar 2026 series"},
{id:"topi",ru:"Топи",origin:"ru",y1:2021,y2:2021,seasons:1,status:"done",g:["myst","thr"],extra:"7 серий",desc:"Пятеро москвичей сбегают от своих проблем в монастырь у полузаброшенной деревни Топи. Поездка оборачивается цепью жутких событий. Сценарий Дмитрия Глуховского.",note:"Сериал по Глуховскому (книги нет, создавался сразу как сериал). Хтонь с элементами страшной сказки. Тягучий, безнадёжный, завораживающий.",warn:"",img:"img/topi.jpg",who:["m"],imdb:"Topi 2021"},
{id:"slow",ru:"Хромые кони",alt:"Медленные лошади",en:"Slow Horses",origin:"w",y1:2022,y2:null,seasons:6,status:"on",g:["thr"],extra:"продлён на 7-й сезон",desc:"Отдел MI5, куда ссылают провинившихся агентов. Их неряшливый и язвительный шеф Джексон Лэмб (Гэри Олдман) раз за разом втягивает команду в настоящие операции.",note:"Гэри Олдман в главной роли: старый, нарочито противный и разочаровавшийся в жизни глава разведчиков, облажавшихся на своём карьерном пути, но не утративший хватки и готовый биться за своих людей. Такая смесь робота Бендера и Шерлока Холмса. И всё это в декорациях лондонских улочек.",warn:"",img:"img/slow.jpg",fit:"contain",who:["m"]},
{id:"yell",ru:"Йеллоустоун",en:"Yellowstone",origin:"w",y1:2018,y2:2024,seasons:5,status:"done",g:["drama","west"],extra:"",desc:"Семья Даттонов во главе с Джоном (Кевин Костнер) удерживает крупнейшее ранчо Монтаны от застройщиков, резервации и властей. Неовестерн Тейлора Шеридана.",note:"Начинается как отличный бодрый сериал с непредсказуемым сюжетом и столкновением лбами ковбоев и веганов, индейцев в резервациях и «белых», экоактивистов, туристов, байкеров и тех, кто веками владеет землёй и развивает ранчо.\nК сожалению, 5-й сезон как будто перечёркивает многие смелые высказывания и превращается в малоубедительную победу одной из групп. Первые четыре сезона смотрятся одним махом.\nПятый я бы вообще не рекомендовал — лично меня он разочаровывает. Словно постаревший боксёр, кумир детства, который не сумел вовремя завершить карьеру: напропускал ударов, опозорился и проиграл нокаутом.",warn:"Смотреть сезоны 1–4, пятый не рекомендую",img:"img/yell.jpg",who:["m"]},
{id:"mass",ru:"Полуночная месса",en:"Midnight Mass",origin:"w",y1:2021,y2:2021,seasons:1,status:"done",g:["myst","drama"],extra:"мини-сериал, 7 серий",desc:"На маленький рыбацкий остров приезжает молодой священник, и в общине начинаются чудеса, которые быстро становятся пугающими. Медленный, вдумчивый хоррор Майка Флэнагана.",note:"Главный совет — не смотреть первые три серии поздно вечером. После третьей оторваться уже не получится (и придётся досматривать всё остальное). Отличный и яркий сюжет, полностью завершённая история от начала до конца. Один из лучших мини-сериалов, что я видел.",warn:"Первые три серии не смотреть поздно вечером",img:"img/mass.jpg",fit:"contain",who:["m","f"]},
{id:"wife",ru:"Хорошая жена",en:"The Good Wife",origin:"w",y1:2009,y2:2016,seasons:7,status:"done",g:["law","drama"],extra:"",desc:"После громкого скандала с мужем-прокурором Алисия Флоррик после долгого перерыва возвращается в адвокатуру. Дела недели плюс большая история о политике и власти.",note:"От лица Джулианны Маргулис (звезда «Скорой помощи») — про женщину, вынужденную начать карьеру заново и пойти стажёром-юристом в фирму бывшего однокурсника. Стандартный юридический сериал, где каждая серия условно независима от других (хотя есть общая сюжетная линия). В целом удивительно ровный на протяжении всех сезонов.",warn:"",img:"img/wife.jpg",fit:"contain",who:["f"]},
{id:"fight",ru:"Хорошая борьба",en:"The Good Fight",origin:"w",y1:2017,y2:2022,seasons:6,status:"done",g:["law","drama"],extra:"продолжение «Хорошей жены»",desc:"Диана Локхарт теряет сбережения в финансовой афере и начинает заново в чикагской фирме. Острее и злободневнее, чем «Хорошая жена».",note:"Продолжение «Хорошей жены» и скорее сериал для фанатов. Неплохо, но как будто чуть слабее предшественника.",warn:"Скорее для фанатов «Хорошей жены»",img:"img/fight.jpg",fit:"contain",who:["f"]},
{id:"peaky",ru:"Острые козырьки",en:"Peaky Blinders",origin:"w",y1:2013,y2:2022,seasons:6,status:"done",g:["crime","drama"],extra:"",desc:"Бирмингем после Первой мировой: семья Шелби во главе с Томасом (Киллиан Мёрфи) строит криминальную империю. Стиль, музыка и харизма.",note:"Классика промышленного послевоенного Бирмингема. Мрачно, кратко, красиво.",warn:"",img:"img/peaky.jpg",fit:"contain",who:["m"]},
{id:"bsg",ru:"Звёздный крейсер «Галактика»",en:"Battlestar Galactica",origin:"w",y1:2004,y2:2009,seasons:4,status:"done",g:["scifi","drama"],extra:"версия 2004 года",desc:"Машины-сайлоны уничтожили колонии людей. Последний военный корабль ведёт горстку выживших на поиски легендарной Земли. Фантастика, которая на самом деле про политику, веру и выбор.",note:"Отличный сериал, который обязательно надо начать смотреть правильно: с двух пилотных эпизодов, не входящих в сам сериал. Иначе невозможно понять сюжет.",warn:"Начинать с мини-сериала 2003 года (2 части)",img:"img/bsg.jpg",fit:"contain",who:["m","f"]},
{id:"firefly",ru:"Светлячок",en:"Firefly",origin:"w",y1:2002,y2:2002,seasons:1,status:"done",g:["scifi","west"],extra:"14 серий, продолжение — фильм «Миссия «Серенити»» (2005)",desc:"Космический вестерн Джосса Уидона: экипаж маленького транспортника «Серенити» перебивается контрабандой на окраинах обжитой галактики. Закрыт после одного сезона и стал культовым.",note:"Редкий жанр космического вестерна. Легко и симпатично. Очень жаль, что сериал свернули после выхода фильма: могла бы получиться неплохая вселенная.",warn:"",img:"img/firefly.jpg",fit:"contain",who:["m","f"]},
{id:"reacher",ru:"Джек Ричер",en:"Reacher",origin:"w",y1:2022,y2:null,seasons:4,status:"on",g:["thr","crime"],extra:"продлён на 5-й сезон",desc:"Бывший военный следователь бродит по Америке без вещей и адреса и каждый раз оказывается в центре заговора. По романам Ли Чайлда, в главной роли Алан Ричсон.",note:"Guilty pleasure. Фильм-эпос, где хороший герой неуязвим и всегда победит плохих. Не без самоиронии и вообще юмора. Ежегодное развлечение: отдохнуть и посмотреть.",warn:"",img:"img/reacher.jpg",fit:"contain",who:["m"]},
{id:"land",ru:"Лэндмен",en:"Landman",origin:"w",y1:2024,y2:null,seasons:2,status:"on",g:["drama","west"],extra:"3-й сезон снимается",desc:"Кризис-менеджер нефтяной компании Томми Норрис (Билли Боб Торнтон) разруливает дела в западном Техасе между нефтяниками, картелем и собственной семьёй. Тейлор Шеридан.",note:"От создателей «Йеллоустоуна». Первый сезон отличный. Второй пугающим образом напоминает мелодраму (но всё спасает последняя серия). Тревожно, каким выйдет третий.",warn:"2-й сезон слабее, но финал спасает",img:"img/land.jpg",fit:"contain",who:["m"]}
];
/* ===== конец данных ===== */
/* Иллюстрации: свои рисунки по атмосфере сериала, viewBox 400x150 */
const rep=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join("");
const rnd=(()=>{let s=7;return()=>(s=s*16807%2147483647)/2147483647})();
const stars=(n,h)=>rep(n,()=>`<circle cx="${(rnd()*400).toFixed(0)}" cy="${(rnd()*h).toFixed(0)}" r="${(rnd()*1.2+.4).toFixed(1)}" fill="#fff" opacity="${(rnd()*.6+.3).toFixed(2)}"/>`);

const ICON={m:'<svg viewBox="0 0 24 24" role="img" aria-label="мальчик"><circle cx="12" cy="7" r="4" fill="#2b59c3"/><path d="M4 22c0-5 3.6-8 8-8s8 3 8 8z" fill="#2b59c3"/></svg>',f:'<svg viewBox="0 0 24 24" role="img" aria-label="девочка"><circle cx="12" cy="7" r="4" fill="#e04f8a"/><path d="M12 13c-3 0-5 2-6.5 9h13C17 15 15 13 12 13z" fill="#e04f8a"/></svg>'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pl=(n,a,b,c)=>{const m=n%10,h=n%100;return m==1&&h!=11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const aud=s=>s.who.length==2?"Для всех":s.who[0]=="m"?"Больше любят мальчики":"Больше любят девочки";
const years=s=>s.y2===null?s.y1+" — сейчас":s.y1===s.y2?String(s.y1):s.y1+"–"+s.y2;
const col=s=>G[s.g[0]][1];
const F={origin:"all",genre:"all",status:"all",len:"all",aud:"all",q:""};
try{Object.assign(F,JSON.parse(localStorage.getItem("serials-f")||"{}"))}catch(e){}
const OPT={origin:[["all","Все"],["ru","Российские"],["w","Зарубежные"]],status:[["all","Любой"],["done","Завершён"],["on","Продолжается"]],aud:[["all","Все"],["m","Больше любят мальчики","","m"],["f","Больше любят девочки","","f"],["mf","Для всех","","mf"]],len:[["all","Любая"],["short","Один сезон"],["long","Несколько сезонов"]],genre:[["all","Все"]].concat(Object.entries(G).map(([k,v])=>[k,v[0],v[1]]))};
const ok=s=>(F.origin=="all"||s.origin==F.origin)&&(F.genre=="all"||s.g.includes(F.genre))&&(F.status=="all"||s.status==F.status)&&(F.aud=="all"||s.who.join("")==F.aud)&&(F.len=="all"||(F.len=="short")==(s.seasons==1))&&(!F.q||[s.ru,s.alt,s.en,s.desc,s.note].join(" ").toLowerCase().includes(F.q.toLowerCase()));
const card=s=>{
const st=s.status=="on"?'<span class="st on">Продолжается</span>':s.status=="done"?'<span class="st done">Завершён</span>':"";
const orig=[s.en,s.alt].filter(Boolean).map(esc).join(" · ");
return `<article class="card" id="c-${s.id}" style="--c:${col(s)}">
${s.img?`<div class="art photo${s.fit?" contain":""}">${s.fit?`<div class="blur" style="background-image:url(${esc(s.img)})"></div>`:""}<img src="${esc(s.img)}" alt="${esc(s.ru)}" loading="lazy"></div>`:`<div class="art" aria-hidden="true"><svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice">${ART[s.id]||""}</svg></div>`}
<div class="top"><div><h3>${esc(s.ru)}</h3>${orig?`<div class="orig">${orig}</div>`:""}</div>${s.who.length?`<div class="who" title="${aud(s)}">${s.who.map(w=>ICON[w]||"").join("")}</div>`:""}</div>
<div class="meta"><span class="y">${years(s)}</span><span>${s.seasons} ${pl(s.seasons,"сезон","сезона","сезонов")}${s.extra?", "+esc(s.extra):""}</span>${st}</div>
<p class="desc">${esc(s.desc)}</p>
${s.warn?`<p class="warn">⚠ ${esc(s.warn)}</p>`:""}
${s.note?`<div class="note"><b>Отзыв Ивана</b>${s.note.split("\n").map(t=>`<p>${esc(t)}</p>`).join("")}</div>`:""}
<div class="tags">${s.g.map(k=>`<span>${G[k][0]}</span>`).join("")}</div>
<div class="lnk"><a href="https://www.imdb.com/find/?q=${encodeURIComponent(s.imdb||s.en||s.ru)}&amp;s=tt" target="_blank" rel="noopener">Постер и трейлер на IMDb ↗</a></div>
</article>`};
const rack=document.getElementById("rack");
rack.innerHTML=S.map((s,i)=>{const w=26+Math.min(s.seasons,7)*9,h=150+((i*37)%5)*12;return `<button class="spine" type="button" data-id="${s.id}" style="width:${w}px;height:${h}px;background:${col(s)}" title="${esc(s.ru)}"><span>${esc(s.ru)}</span></button>`}).join("");
document.getElementById("legend").innerHTML=Object.values(G).map(v=>`<span><i style="background:${v[1]}"></i>${v[0]}</span>`).join("")+"<span>Толщина корешка — число сезонов</span>";
const seg=(k)=>{document.getElementById("f-"+k).innerHTML=OPT[k].map(o=>`<button type="button" data-k="${k}" data-v="${o[0]}" aria-pressed="${F[k]==o[0]}">${o[2]?`<i style="background:${o[2]}"></i>`:""}${o[3]?`<span class="ic">${o[3].split("").map(w=>ICON[w]).join("")}</span>`:""}${o[1]}</button>`).join("")};
const list=document.getElementById("list");
const render=()=>{
["origin","genre","status","len","aud"].forEach(seg);
const vis=S.filter(ok);
document.getElementById("count").textContent=`Показано ${vis.length} из ${S.length}`;
rack.querySelectorAll(".spine").forEach(b=>b.classList.toggle("off",!vis.some(s=>s.id==b.dataset.id)));
const grp=[["ru","Российские"],["w","Зарубежные"]].map(([o,t])=>{const a=vis.filter(s=>s.origin==o);return a.length?`<h2>${t}</h2><div class="grid">${a.map(card).join("")}</div>`:""}).join("");
list.innerHTML=grp||'<p class="empty">Под такие фильтры ничего не нашлось.</p>';
try{localStorage.setItem("serials-f",JSON.stringify(F))}catch(e){}
};
document.querySelector(".controls").addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(!b)return;F[b.dataset.k]=b.dataset.v;render()});
const q=document.getElementById("q");q.value=F.q;
q.addEventListener("input",()=>{F.q=q.value.trim();render()});
document.getElementById("reset").addEventListener("click",()=>{Object.assign(F,{origin:"all",genre:"all",status:"all",len:"all",aud:"all",q:""});q.value="";render()});
rack.addEventListener("click",e=>{const b=e.target.closest(".spine");if(!b)return;let c=document.getElementById("c-"+b.dataset.id);
if(!c){Object.assign(F,{origin:"all",genre:"all",status:"all",len:"all",aud:"all",q:""});q.value="";render();c=document.getElementById("c-"+b.dataset.id)}
c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600)});
render();
}
